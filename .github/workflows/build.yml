name: Compilar RUTA TRANSPORTE GAO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Crear codigo de la app
        run: |
          mkdir -p app/src/main/java/com/rutatransportegao/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RutaTransporteGAO"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.rutatransportegao.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rutatransportegao.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">RUTA TRANSPORTE GAO</string>
              <string name="accessibility_desc">Lee automáticamente los viajes para calcular el valor por km.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0B0F19"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⚡ RUTA TRANSPORTE GAO"
                      android:textColor="#FFFFFF"
                      android:textSize="22sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="Activá los dos permisos abajo:"
                      android:textColor="#94A3B8"
                      android:textSize="14sp" />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginVertical="16dp"
                      android:background="#1E293B" />

                  <Button
                      android:id="@+id/btnOverlayPerm"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:backgroundTint="#2563EB"
                      android:text="1. Permitir Superposición"
                      android:textColor="#FFFFFF" />

                  <Button
                      android:id="@+id/btnAccessibilityPerm"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:backgroundTint="#2563EB"
                      android:text="2. Activar en Accesibilidad"
                      android:textColor="#FFFFFF" />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginVertical="16dp"
                      android:background="#1E293B" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Tu tarifa mínima deseada:"
                      android:textColor="#38BDF8"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Min $/km: $"
                          android:textColor="#FFFFFF"
                          android:textSize="16sp" />

                      <EditText
                          android:id="@+id/editMinRate"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:inputType="number"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/btnSave"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:backgroundTint="#10B981"
                          android:text="Guardar"
                          android:textColor="#000000" />
                  </LinearLayout>

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginVertical="16dp"
                      android:background="#1E293B" />

                  <Button
                      android:id="@+id/btnTestOverlay"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:backgroundTint="#334155"
                      android:text="🧪 Probar cartel flotante"
                      android:textColor="#FFFFFF" />

              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />

                  <service
                      android:name=".ReaderAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/rutatransportegao/app/MainActivity.kt
          package com.rutatransportegao.app

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("gao_prefs", Context.MODE_PRIVATE)
                  val editMinRate = findViewById<EditText>(R.id.editMinRate)
                  val btnSave = findViewById<Button>(R.id.btnSave)
                  val btnOverlayPerm = findViewById<Button>(R.id.btnOverlayPerm)
                  val btnAccessibilityPerm = findViewById<Button>(R.id.btnAccessibilityPerm)
                  val btnTestOverlay = findViewById<Button>(R.id.btnTestOverlay)

                  val currentMin = prefs.getFloat("min_rate", 500f)
                  editMinRate.setText(currentMin.toInt().toString())

                  btnSave.setOnClickListener {
                      val v = editMinRate.text.toString().toFloatOrNull() ?: 500f
                      prefs.edit().putFloat("min_rate", v).apply()
                      Toast.makeText(this, "Guardado: $$v/km mínimo", Toast.LENGTH_SHORT).show()
                  }

                  btnOverlayPerm.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "Permiso de superposición ya concedido", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnAccessibilityPerm.setOnClickListener {
                      val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      startActivity(intent)
                  }

                  btnTestOverlay.setOnClickListener {
                      OverlayService.show(this, 3500.0, 4.2)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)
                  val overlayOk = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) Settings.canDrawOverlays(this) else true
                  if (overlayOk) {
                      tvStatus.text = "Superposición lista. Concedé Accesibilidad para automatizar."
                  } else {
                      tvStatus.text = "Faltan conceder permisos para comenzar."
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/rutatransportegao/app/OverlayService.kt
          package com.rutatransportegao.app

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          class OverlayService : Service() {

              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private val handler = Handler(Looper.getMainLooper())
              private val removeRunnable = Runnable { removeOverlay() }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val earnings = intent?.getDoubleExtra("earnings", 0.0) ?: 0.0
                  val km = intent?.getDoubleExtra("km", 0.0) ?: 0.0

                  if (earnings > 0 && km > 0) {
                      showFloatingCard(earnings, km)
                  }

                  return START_NOT_STICKY
              }

              private fun showFloatingCard(earnings: Double, km: Double) {
                  removeOverlay()

                  val prefs = getSharedPreferences("gao_prefs", Context.MODE_PRIVATE)
                  val minRate = prefs.getFloat("min_rate", 500f).toDouble()
                  val ratePerKm = earnings / km
                  val isProfitable = ratePerKm >= minRate

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 130
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 24, 40, 24)

                      val bg = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 32f
                          if (isProfitable) {
                              setColor(Color.parseColor("#E610B981"))
                              setStroke(4, Color.WHITE)
                          } else {
                              setColor(Color.parseColor("#E6EF4444"))
                              setStroke(4, Color.WHITE)
                          }
                      }
                      background = bg

                      val txtTitle = TextView(context).apply {
                          text = if (isProfitable) "GAO: 🔥 RENTABLE" else "GAO: ⛔ RECHAZAR"
                          setTextColor(Color.WHITE)
                          textSize = 17f
                          paint.isFakeBoldText = true
                          gravity = Gravity.CENTER
                      }

                      val txtDetail = TextView(context).apply {
                          val rateStr = String.format("$%.0f/km", ratePerKm)
                          val earnStr = String.format("$%.0f", earnings)
                          val kmStr = String.format("%.1f km", km)
                          text = "$rateStr  |  $earnStr en $kmStr"
                          setTextColor(Color.WHITE)
                          textSize = 14f
                          gravity = Gravity.CENTER
                          setPadding(0, 6, 0, 0)
                      }

                      addView(txtTitle)
                      addView(txtDetail)

                      setOnClickListener {
                          removeOverlay()
                      }
                  }

                  overlayView = card

                  try {
                      windowManager?.addView(overlayView, params)
                      handler.removeCallbacks(removeRunnable)
                      handler.postDelayed(removeRunnable, 12000)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun removeOverlay() {
                  overlayView?.let {
                      try {
                          windowManager?.removeView(it)
                      } catch (e: Exception) {
                          // Ignore
                      }
                      overlayView = null
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  removeOverlay()
              }

              companion object {
                  fun show(context: Context, earnings: Double, km: Double) {
                      val intent = Intent(context, OverlayService::class.java).apply {
                          putExtra("earnings", earnings)
                          putExtra("km", km)
                      }
                      try {
                          context.startService(intent)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/rutatransportegao/app/ReaderAccessibilityService.kt
          package com.rutatransportegao.app

          import android.accessibilityservice.AccessibilityService
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ReaderAccessibilityService : AccessibilityService() {

              private var lastProcessTime = 0L

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return

                  val now = SystemClock.uptimeMillis()
                  if (now - lastProcessTime < 1000) return

                  val rootNode = rootInActiveWindow ?: return

                  val textList = mutableListOf<String>()
                  extractAllText(rootNode, textList)

                  var detectedPrice: Double? = null
                  var detectedKm: Double? = null

                  for (item in textList) {
                      val raw = item.trim()

                      if (detectedKm == null && (raw.contains("km", ignoreCase = true) || raw.contains("kms", ignoreCase = true))) {
                          val clean = raw.lowercase()
                              .replace("kms", "")
                              .replace("km", "")
                              .replace(",", ".")
                              .replace(Regex("[^0-9.]"), "")
                              .trim()
                          val parsed = clean.toDoubleOrNull()
                          if (parsed != null && parsed in 0.2..100.0) {
                              detectedKm = parsed
                          }
                      }

                      if (detectedPrice == null && raw.contains("$")) {
                          var clean = raw.replace("$", "").trim()
                          if (clean.contains(".") && clean.contains(",")) {
                              clean = clean.replace(".", "").replace(",", ".")
                          } else if (clean.contains(".")) {
                              val parts = clean.split(".")
                              if (parts.size == 2 && parts[1].length == 3) {
                                  clean = clean.replace(".", "")
                              }
                          } else if (clean.contains(",")) {
                              val parts = clean.split(",")
                              if (parts.size == 2 && parts[1].length == 3) {
                                  clean = clean.replace(",", "")
                              } else {
                                  clean = clean.replace(",", ".")
                              }
                          }
                          clean = clean.replace(Regex("[^0-9.]"), "")
                          val parsed = clean.toDoubleOrNull()
                          if (parsed != null && parsed in 100.0..500000.0) {
                              detectedPrice = parsed
                          }
                      }
                  }

                  if (detectedPrice != null && detectedKm != null && detectedKm > 0) {
                      lastProcessTime = now
                      OverlayService.show(applicationContext, detectedPrice, detectedKm)
                  }
              }

              private fun extractAllText(node: AccessibilityNodeInfo, outList: MutableList<String>) {
                  node.text?.let { outList.add(it.toString()) }
                  node.contentDescription?.let { outList.add(it.toString()) }
                  for (i in 0 until node.childCount) {
                      node.getChild(i)?.let { child ->
                          extractAllText(child, outList)
                      }
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Preparar instalador
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./RutaTransporteGAO.apk

      - name: Subir artefacto para descarga
        uses: actions/upload-artifact@v4
        with:
          name: RutaTransporteGAO-APK
          path: ./RutaTransporteGAO.apk

      - name: Crear Release publica para descarga directa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.1 RutaTransporteGAO.apk --title "RUTA TRANSPORTE GAO v1.0.1" --notes "Tu app personalizada lista para instalar." || true
